<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa del Policía - Tienda</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="dark-theme">

  <!-- Encabezado / Navegación -->
  <header class="glass-header">
    <div class="logo-container">
      <img id="site-logo" src="https://i.imgur.com/9W9C2TC.png" alt="La Casa del Policía">
    </div>
    
    <div class="search-bar">
      <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
      <input type="text" id="search-input" placeholder="Buscar equipamiento, accesorios...">
    </div>

    <div class="user-actions">
      <button id="btn-theme" class="btn-icon" title="Cambiar Tema">
        <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 12 4A8 8 0 0 0 12 20V4Z"/></svg>
      </button>

      <button id="btn-auth-modal" class="btn-icon-text">
        <svg id="default-user-icon" class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>
        <span id="auth-btn-label">Cuenta</span>
      </button>

      <button id="btn-cart" class="btn-icon-text cart-btn">
        <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17,18A2,2 0 0,1 19,20A2,2 0 0,1 17,22A2,2 0 0,1 15,20A2,2 0 0,1 17,18M1,2H4.27L5.21,4H20A1,1 0 0,1 21,5C21,5.17 20.95,5.34 20.88,5.5L17.3,11.97C16.96,12.58 16.3,13 15.55,13H8.1L7.2,14.63L7.17,14.75A0.25,0.25 0 0,0 7.42,15H19V17H7C5.89,17 5,16.1 5,15C5,14.65 5.09,14.32 5.24,14.04L6.6,11.59L3,4H1V2M7,18A2,2 0 0,1 9,20A2,2 0 0,1 7,22A2,2 0 0,1 5,20A2,2 0 0,1 7,18Z"/></svg>
        <span id="cart-count" class="badge">0</span>
      </button>
    </div>
  </header>

  <!-- Botón Lápiz Admin (Azul Rey) -->
  <button id="admin-pencil-btn" class="pencil-btn hidden">
    <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></svg>
    <span>Gestionar Tienda</span>
  </button>

  <!-- Modal Auth / Perfil -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content glass-card">
      <span id="close-auth" class="close">&times;</span>
      
      <!-- VISTA 1: Formulario de Login / Registro -->
      <div id="auth-logged-out-view">
        <h2 id="auth-title">Iniciar Sesión</h2>
        <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 5px;">Ingresa tus datos para continuar.</p>
        
        <form id="auth-form">
          <input type="email" id="auth-email" placeholder="Correo electrónico" class="glass-input-field" required>
          <input type="password" id="auth-password" placeholder="Contraseña" class="glass-input-field" required>
          <button type="submit" id="auth-submit-btn" class="btn-primary">Entrar</button>
        </form>
        
        <p id="auth-toggle-text" style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
          ¿No tienes cuenta? <span id="auth-toggle-link" style="color: var(--accent-color); cursor: pointer; font-weight: bold;">Regístrate</span>
        </p>
      </div>

      <!-- VISTA 2: Perfil del Usuario -->
      <div id="auth-logged-in-view" class="hidden" style="text-align: center;">
        <h2>Mi Perfil</h2>
        <div style="margin: 20px 0;">
          <div style="width: 70px; height: 70px; background: var(--accent-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; margin: 0 auto 10px auto;" id="profile-initial">U</div>
          <p id="user-display-email" style="font-weight: bold; font-size: 1.1rem; word-break: break-all;"></p>
          <p id="user-display-role" style="font-size: 0.85rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; font-weight: 600;"></p>
        </div>

        <button id="btn-logout" class="btn-secondary" style="border-color: #ef4444; color: #ef4444;">Cerrar Sesión</button>
      </div>

    </div>
  </div>

  <!-- Modal Admin (Gestionar Tienda) -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content glass-card modal-large">
      <span id="close-admin" class="close">&times;</span>
      <h2>Panel de Administración</h2>

      <div class="admin-tabs">
        <button id="tab-btn-inventory" class="tab-btn active">Inventario / Editar</button>
        <button id="tab-btn-product" class="tab-btn">Nuevo Producto</button>
        <button id="tab-btn-category" class="tab-btn">Nueva Categoría</button>
      </div>

      <!-- TAB 1: Lista de Productos y Categorías (Editar/Eliminar) -->
      <div id="tab-content-inventory" class="admin-tab-content">
        <h3 style="margin-top: 10px; font-size: 1.05rem;">Productos Existentes</h3>
        <div id="admin-product-list" class="admin-item-list">Cargando...</div>

        <h3 style="margin-top: 20px; font-size: 1.05rem;">Categorías Existentes</h3>
        <div id="admin-category-list" class="admin-item-list">Cargando...</div>
      </div>

      <!-- TAB 2: Formulario Nuevo / Editar Producto -->
      <form id="form-add-product" class="admin-tab-content hidden">
        <h3 id="form-product-title" style="margin-bottom: 5px;">Crear Producto</h3>
        <input type="hidden" id="prod-id-edit" value="">
        <input type="text" id="prod-name" placeholder="Nombre del Producto" class="glass-input-field" required>
        <textarea id="prod-desc" placeholder="Descripción del producto..." class="glass-input-field" rows="2"></textarea>
        
        <div class="form-row">
          <input type="number" id="prod-price" placeholder="Precio ($)" class="glass-input-field" step="0.01" required>
          <select id="prod-category" class="glass-input-field" required>
            <option value="">Cargando categorías...</option>
          </select>
        </div>

        <input type="text" id="prod-images" placeholder="URL de Imagen (Ej: https://i.imgur.com/...)" class="glass-input-field" required>
        <input type="text" id="prod-variants" placeholder="Variantes separadas por coma (Ej: Negro, Azul, Talla M)" class="glass-input-field">

        <div style="display: flex; gap: 10px;">
          <button type="submit" id="btn-save-product" class="btn-primary">Guardar Producto</button>
          <button type="button" id="btn-cancel-edit-prod" class="btn-secondary hidden" style="margin-top: 15px;">Cancelar</button>
        </div>
      </form>

      <!-- TAB 3: Formulario Nueva Categoría -->
      <form id="form-add-category" class="admin-tab-content hidden">
        <input type="text" id="cat-name" placeholder="Nombre de Categoría (Ej: Chalecos Tácticos)" class="glass-input-field" required>
        <button type="submit" class="btn-primary">Crear Categoría</button>
      </form>
    </div>
  </div>

  <!-- Catalogo Principal -->
  <main id="store-rows">
    <!-- Se llena automáticamente con productos de Firebase -->
  </main>

  <script type="module" src="app.js?v=4"></script>
</body>
</html>
