<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa del Policía</title>
  <!-- El ?v=2 obliga al navegador a descargar el CSS nuevo sin usar la caché vieja -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- NAVBAR SUPERIOR -->
  <header class="navbar">
    <div class="nav-left">
      <img id="site-logo" src="logo.png" alt="Logo" class="logo">
      <span class="brand-name">La Casa del Policía</span>
    </div>

    <div class="nav-actions">
      <!-- Favoritos -->
      <button id="btn-favs" class="icon-btn" title="Favoritos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span id="fav-count" class="badge">0</span>
      </button>

      <!-- Carrito -->
      <button id="btn-cart" class="icon-btn" title="Carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cart-count" class="badge">0</span>
      </button>

      <!-- Cambiar Tema -->
      <button id="btn-theme" class="icon-btn-text">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <span>Tema</span>
      </button>

      <!-- Mi Perfil / Cuenta -->
      <button id="btn-account" class="btn-primary">Mi Perfil</button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="main-container">
    
    <!-- BARRA DE BÚSQUEDA Y FILTROS ENCABEZANDO EL CATÁLOGO -->
    <section class="catalog-header">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="input-search" placeholder="Buscar productos...">
      </div>
      <button id="btn-filters" class="btn-secondary">Filtros</button>
    </section>

    <!-- SECCIONES DE PRODUCTOS (CONTENEDORES PARA TU JS) -->
    <div id="catalog-sections">
      <div id="searchResults" class="category-row hidden"></div>
      <div id="categoriesContainer"></div>
    </div>
  </main>

  <!-- FOOTER (BOTÓN DE ADMIN ABAJO) -->
  <footer class="site-footer">
    <p>© 2026 La Casa del Policía</p>
    <button id="btn-admin" class="btn-admin-footer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Modo Admin</span>
    </button>
  </footer>

  <!-- MODAL FILTROS -->
  <div id="modal-filters" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="close-filters">&times;</span>
      <h3>Filtrar Productos</h3>
      <div class="filter-group">
        <label>Categoría:</label>
        <select id="filter-category">
          <option value="all">Todas las categorías</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Ordenar por precio:</label>
        <select id="filter-price">
          <option value="default">Por defecto</option>
          <option value="low">Menor a Mayor</option>
          <option value="high">Mayor a Menor</option>
        </select>
      </div>
      <button id="apply-filters" class="btn-primary full-width">Aplicar Filtros</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
